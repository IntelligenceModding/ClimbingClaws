name: Feature Request
description: Suggest a new feature or improvement for Climbing Claws
title: "[Feature] "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Climbing Claws.

        Please describe the idea clearly and explain how it would improve the project.

  - type: textarea
    id: feature
    attributes:
      label: Feature
      description: What would you like to see added or changed?
      placeholder: Describe the climbing behavior, movement option, enchantment, compatibility improvement, or other change.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
      description: Explain what this would improve or what use case it would support.
      placeholder: Explain why this feature would be useful.
    validations:
      required: true

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature Area
      description: Which part of Climbing Claws would this request affect?
      options:
        - Wall Climbing
        - Ceiling Climbing
        - Hanging / Controlled Descent
        - Movement / Launching
        - Climbing Claws Item
        - Durability
        - Vanilla Enchantments
        - Wall Spring
        - Canopy Grip
        - Curios Integration
        - JEI Integration
        - Crafting / Progression
        - Trades / Loot
        - Rendering / Textures
        - Multiplayer Behavior
        - Compatibility
        - Other
        - Not sure
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Suggested Behavior or Design
      description: Explain how you imagine the feature working or looking.
      placeholder: Describe your suggested implementation, workflow, appearance, or behavior.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Add screenshots, mockups, examples, links, or other references if useful.

  - type: input
    id: version
    attributes:
      label: Relevant Minecraft Version
      description: If this request relates to a specific Minecraft version, enter it here.
      placeholder: "Example: 26.1.1 or N/A"

  - type: checkboxes
    id: checks
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues and did not find the same suggestion.
          required: true
        - label: This request is related to Climbing Claws and fits the general purpose of the project.
          required: true
