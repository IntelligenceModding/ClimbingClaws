# Gradle
org.gradle.jvmargs=-Xmx8G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# ForgeGradle's run/data tasks are not configuration-cache compatible.
org.gradle.configuration-cache=false

# Parchment
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]

# Forge
forge_version=52.1.21
loader_version_range=[1,)

# Dependencies
jei_version=19.25.0.322
jep_version=4.0.5
# Curios has no Forge build for 1.21.1; compat code is kept but unwired (see CuriosCompat classes).

# Mod properties
mod_id=climbingclaws
mod_name=Climbing Claws
mod_license=MIT License
mod_version=1.3.0
mod_group_id=de.artemis.climbingclaws
mod_authors=DoomedArtemis
mod_description=Utility mod that adds hand-held Climbing Claws for wall and ceiling traversal, with enchantments and survival-friendly mobility.
