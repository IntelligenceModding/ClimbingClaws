plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = minecraft_version + "-" + mod_version
group = mod_group_id

repositories {
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    clientRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
    }
    reiRuntimeMod {
        canBeConsumed = false
        canBeResolved = true
        transitive = true
        extendsFrom clientRuntimeMods
    }
    jeiRuntimeMod {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom clientRuntimeMods
    }
}

tasks.register('cleanClientRuntimeMods', Delete) {
    delete layout.projectDirectory.dir('run/mods')
}

tasks.register('cleanReiRuntimeMods', Delete) {
    delete layout.projectDirectory.dir('run-rei/mods')
}

tasks.register('cleanJeiRuntimeMods', Delete) {
    delete layout.projectDirectory.dir('run-jei/mods')
}

tasks.register('syncClientRuntimeMods', Sync) {
    dependsOn tasks.named('cleanClientRuntimeMods')
    from configurations.clientRuntimeMods
    into layout.projectDirectory.dir('run/mods')
}

tasks.register('syncReiRuntimeMods', Sync) {
    dependsOn tasks.named('cleanReiRuntimeMods')
    from configurations.reiRuntimeMod
    into layout.projectDirectory.dir('run-rei/mods')
}

tasks.register('syncJeiRuntimeMods', Sync) {
    dependsOn tasks.named('cleanJeiRuntimeMods')
    from configurations.jeiRuntimeMod
    into layout.projectDirectory.dir('run-jei/mods')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore tasks.named('syncClientRuntimeMods')
        }

        clientWithREI {
            client()
            gameDirectory = file('run-rei')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
            taskBefore tasks.named('syncReiRuntimeMods')
        }

        clientWithJEI {
            client()
            gameDirectory = file('run-jei')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore tasks.named('syncJeiRuntimeMods')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir 'src/generated/client'
    exclude '.cache/**'
}

dependencies {
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    jeiRuntimeMod("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    jeiRuntimeMod("maven.modrinth:just-enough-professions-jep:${jep_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}")
    reiRuntimeMod("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")
    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}:api")
    clientRuntimeMods("top.theillusivec4.curios:curios-neoforge:${curios_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            rei_version_range      : rei_version_range,
            curios_version_range   : curios_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('runClientData') {
    dependsOn tasks.named('runData')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
