dependencies {
    // compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    // runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    // compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}")
    // compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}")
    // runtimeOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")
    // compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}:api")
    // runtimeOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}")
    // localRuntime("maven.modrinth:just-enough-professions-jep:${jep_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            // rei_version_range      : rei_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('runClientData') {
    dependsOn tasks.named('runData')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
