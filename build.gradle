plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = minecraft_version + "-" + mod_version
group = mod_group_id

repositories {
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    // maven {
    //     name = "Shedaniel Maven"
    //     url = "https://maven.shedaniel.me"
    // }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    runtimeClasspath.extendsFrom localRuntime
    clientRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
    }
    // reiRuntimeMod {
    //     canBeConsumed = false
    //     canBeResolved = true
    //     transitive = true
    // }
}

tasks.register('cleanClientRuntimeMods', Delete) {
    delete layout.projectDirectory.dir('run/mods')
}

tasks.register('syncClientRuntimeMods', Sync) {
    dependsOn tasks.named('cleanClientRuntimeMods')
    from configurations.clientRuntimeMods
    into layout.projectDirectory.dir('run/mods')
}

neoForge {
    version = project.neo_version

    // parchment {
    //     mappingsVersion = project.parchment_mappings_version
    //     minecraftVersion = project.parchment_minecraft_version
    // }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore tasks.named('syncClientRuntimeMods')
        }

        // clientWithREI {
        //     client()
        //     gameDirectory = file('run-rei')
        //     systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        //     systemProperty 'neoforge.warnings.onlyin.hide', 'true'
        //     taskBefore tasks.named('syncReiRuntimeMods')
        // }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir 'src/generated/client'
    exclude '.cache/**'
    exclude 'data/curios/**'
    exclude 'data/climbingclaws/curios/**'
}

sourceSets.main.java {
    exclude 'de/artemis/climbingclaws/compat/jei/**'
    exclude 'de/artemis/climbingclaws/compat/rei/**'
    exclude 'de/artemis/climbingclaws/compat/curios/**'
}

