plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}-forge-mc${minecraft_version}"
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

configurations {
    clientRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
    }
    jeiRuntimeMod {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom clientRuntimeMods
    }
    reiRuntimeMod {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom clientRuntimeMods
    }
}

tasks.register('syncClientRuntimeMods', Sync) {
    from configurations.clientRuntimeMods
    into layout.projectDirectory.dir('run-1.20.1/mods')
}

tasks.register('syncJeiRuntimeMods', Sync) {
    from configurations.jeiRuntimeMod
    into layout.projectDirectory.dir('run-1.20.1-jei/mods')
}

tasks.register('syncReiRuntimeMods', Sync) {
    from configurations.reiRuntimeMod
    into layout.projectDirectory.dir('run-1.20.1-rei/mods')
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run-1.20.1')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        clientWithJEI {
            parent runs.client
            workingDirectory project.file('run-1.20.1-jei')
        }

        clientWithREI {
            parent runs.client
            workingDirectory project.file('run-1.20.1-rei')
        }

        server {
            workingDirectory project.file('run-1.20.1-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            arg '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run-1.20.1-data')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn tasks.named('syncClientRuntimeMods')
}

tasks.matching { it.name == 'runClientWithREI' }.configureEach {
    dependsOn tasks.named('syncReiRuntimeMods')
}

tasks.matching { it.name == 'runClientWithJEI' }.configureEach {
    dependsOn tasks.named('syncJeiRuntimeMods')
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir 'src/generated/client'
    exclude '.cache/**'
}

// FML's ClasspathLocator builds a mod's SecureJar from a single directory. Since Gradle keeps
// compiled classes and resources (mods.toml) in separate output directories, merge resources
// into the classes directory so dev runs see one directory containing both.
afterEvaluate {
    sourceSets.main.output.resourcesDir = sourceSets.main.output.classesDirs.singleFile
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    jeiRuntimeMod(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")) { transitive = false }
    jeiRuntimeMod(fg.deobf("maven.modrinth:kB56GtWA:${jep_version}")) { transitive = false }
    compileOnly(fg.deobf("me.shedaniel:RoughlyEnoughItems-forge:${rei_version}")) { transitive = false }
    compileOnly(fg.deobf('dev.architectury:architectury-forge:9.0.7')) { transitive = false }
    reiRuntimeMod(fg.deobf("me.shedaniel:RoughlyEnoughItems-forge:${rei_version}")) { transitive = false }
    reiRuntimeMod(fg.deobf('dev.architectury:architectury-forge:9.0.7')) { transitive = false }
    reiRuntimeMod(fg.deobf('me.shedaniel.cloth:cloth-config-forge:11.0.99')) { transitive = false }
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    clientRuntimeMods(fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")) { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

tasks.register('runClientData') {
    dependsOn tasks.named('runData')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
