plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}-forge-mc${minecraft_version}"
group = mod_group_id

repositories {
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    clientRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
    }
    jeiRuntimeMod {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom clientRuntimeMods
    }
}

tasks.register('cleanClientRuntimeMods', Delete) {
    delete layout.projectDirectory.dir('run/mods')
}

tasks.register('syncClientRuntimeMods', Sync) {
    dependsOn tasks.named('cleanClientRuntimeMods')
    from configurations.clientRuntimeMods
    into layout.projectDirectory.dir('run/mods')
}

tasks.register('syncJeiRuntimeMods', Sync) {
    from configurations.jeiRuntimeMod
    into layout.projectDirectory.dir('run-jei/mods')
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${parchment_minecraft_version}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        clientWithJEI {
            parent runs.client
            workingDirectory project.file('run-jei')
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            arg '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn tasks.named('syncClientRuntimeMods')
}

tasks.register('runClientWithREI') {
    group = 'forgegradle runs'
    description = 'Reports REI compatibility for this Forge build.'
    doLast {
        throw new GradleException("REI for Minecraft ${minecraft_version} is available for Fabric and NeoForge. This project uses Forge. Use runClientWithJEI for a recipe viewer on Forge.")
    }
}

tasks.matching { it.name == 'runClientWithJEI' }.configureEach {
    dependsOn tasks.named('syncJeiRuntimeMods')
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir 'src/generated/client'
    exclude '.cache/**'
}

// FML's ClasspathLocator builds a mod's SecureJar from a single directory. Since Gradle keeps
// compiled classes and resources (mods.toml) in separate output directories, merge resources
// into the classes directory so dev runs see one directory containing both.
afterEvaluate {
    sourceSets.main.output.resourcesDir = sourceSets.main.output.classesDirs.singleFile
}

// No Forge build of Curios exists for Minecraft 1.21.x (newest Forge release targets 1.20.1).
// The compat code is kept in the tree for future re-enablement but can't compile without the
// top.theillusivec4.curios.api packages, so it's excluded from this build's compilation.
sourceSets.main.java {
    exclude 'de/artemis/climbingclaws/compat/curios/**'
    // The Minecraft 1.21.1 REI releases target Fabric and NeoForge.
    exclude 'de/artemis/climbingclaws/compat/rei/**'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    jeiRuntimeMod("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    jeiRuntimeMod("maven.modrinth:just-enough-professions-jep:${jep_version}")
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('runClientData') {
    dependsOn tasks.named('runData')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
